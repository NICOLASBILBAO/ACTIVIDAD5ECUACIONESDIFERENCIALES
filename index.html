<style>
/* Paleta: azul institucional (dominante), verde=éxito, dorado=acento, negro=texto, blanco=tarjetas, rojo=solo error */
:root{--az:#0B3D91;--az2:#082C69;--ve:#1B7F3B;--or:#F2B705;--ng:#1A1A1A;--bl:#fff;--ro:#C62828;--bg:#EAF0FA}
*{box-sizing:border-box}body{margin:0;font-family:'Source Sans 3',sans-serif;color:var(--ng);background:var(--bg)}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:.2em 0}
header{background:var(--az);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--or)}
.card{background:var(--bl);border-radius:12px;padding:18px;margin:14px auto;max-width:1100px;box-shadow:0 2px 10px #0003}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
#fig{height:320px;border-radius:10px;background:radial-gradient(#1b4fb5,#071a3d);display:flex;align-items:center;justify-content:center;overflow:hidden}
#fig canvas{width:100%;height:100%}
button{background:var(--az);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 15px 'Source Sans 3';cursor:pointer;margin:3px}
button:hover:not(:disabled){background:var(--or);color:var(--ng)}button:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:#fff;color:var(--az);border:2px solid var(--az)}
input[type=text],input[type=number]{padding:9px;border:2px solid var(--az);border-radius:8px;font-size:16px;width:100%;max-width:340px}
.opt{display:block;margin:6px 0;padding:8px;border:2px solid #cfd8ea;border-radius:8px;cursor:pointer}.opt:has(input:checked){border-color:var(--az);background:#eef3ff}
.fb{margin-top:10px;padding:10px;border-radius:8px;display:none}.ok{background:#e3f4e8;border-left:5px solid var(--ve);display:block}.bad{background:#fdeaea;border-left:5px solid var(--ro);display:block}
.hint{background:#fff6d6;border-left:5px solid var(--or);padding:8px;margin-top:8px;display:none}
#sub{min-height:22px;font-style:italic;background:#f3f3f3;padding:6px 10px;border-radius:6px;margin-top:8px}
.bar{height:8px;background:#dbe3f3;border-radius:5px}.bar i{display:block;height:100%;background:var(--or);border-radius:5px}
.cover{text-align:center}.cover h1{font-size:2.3em;color:var(--az)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.k{background:#fff;color:var(--az);border:2px solid var(--az);padding:5px 10px;margin:2px;min-width:36px}
#wk{width:100%;min-height:170px;font:17px 'Source Sans 3',monospace;padding:10px;border:2px solid var(--az);border-radius:8px}
.ins{background:#eef3ff;border-left:5px solid var(--az);padding:8px 12px;border-radius:6px;margin:8px 0}
.proc{background:#f0faf3;border-left:5px solid var(--ve);padding:8px 12px 8px 28px;margin-top:8px;display:none}
.ico{display:inline-block;font-size:1.4em;animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.ill{font-size:2.4em;display:flex;justify-content:center;gap:18px;margin:10px 0}.ill span{animation:fl 2.4s ease-in-out infinite}.ill span:nth-child(2n){animation-delay:.5s}.ill span:nth-child(3n){animation-delay:1s}
.meta{display:inline-block;background:var(--az);color:#fff;border-radius:8px;padding:6px 14px;margin:4px;font-weight:600;border-bottom:3px solid var(--or)}
